# Included by Nginx Proxy Manager inside the existing c2sml.cn TLS server.
# Hermes remains the runtime host; this file only adds same-origin routes.

location = /agent {
    return 404;
}

location ^~ /agent/ {
    return 404;
}

location ^~ /internal/ {
    return 404;
}

location ^~ /auth/internal/ {
    return 404;
}

location = /healthz {
    return 404;
}

location = /auth {
    return 308 /auth/;
}

location = /auth/api/client-session/ {
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
    proxy_no_cache 1;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Ansatz-Installation-ID $http_x_ansatz_installation_id;
    proxy_set_header Connection "";
    proxy_pass http://auth-service:8000;
    proxy_redirect off;

    add_header Cache-Control "no-store" always;
}

